<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #68d34d;
            --border-color: #bcbcbc;
            --text-dark: #000000;
            --input-border: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            display: flex;
            flex-direction: column;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            padding: 25px 20px;
        }

        .back-arrow {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            width: 30px;
            color: var(--text-dark);
        }

        .header h1 {
            flex-grow: 1;
            text-align: center;
            color: var(--primary-green);
            font-size: 1.5rem;
            font-weight: 700;
            margin-right: 30px;
        }

        /* Main Form Card */
        .form-card {
            border: 1px solid var(--border-color);
            border-radius: 25px;
            margin: 10px 20px;
            padding: 30px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-title {
            font-size: 1.2rem;
            font-weight: 400;
            color: #333;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Input Grouping */
        .input-group {
            width: 100%;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-dark);
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid var(--input-border);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }

        /* Action Button */
        .reset-btn {
            width: 80%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: opacity 0.2s;
        }

        .reset-btn:active {
            opacity: 0.8;
        }

        /* Responsive scaling */
        @media (max-width: 380px) {
            .header h1 { font-size: 1.3rem; }
            .form-title { font-size: 1rem; }
            .input-group label { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="header">
            <div class="back-arrow">＜</div>
            <h1>Reset Password</h1>
        </header>

        <main class="form-card">
            <h2 class="form-title">Change Password</h2>

            <div class="input-group">
                <label for="old-pass">Old Password</label>
                <input type="password" id="old-pass">
            </div>

            <div class="input-group">
                <label for="new-pass">New Password</label>
                <input type="password" id="new-pass">
            </div>

            <div class="input-group">
                <label for="confirm-pass">Confirm New Password</label>
                <input type="password" id="confirm-pass">
            </div>

            <button class="reset-btn">Reset Password</button>
        </main>
    </div>

</body>
</html>
