<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance Dashboard</title>
    <style>
        :root {
            --primary-green: #74C947;
            --text-dark: #333;
            --text-gray: #888;
            --bg-light: #ffffff;
            --sidebar-bg: #E0E0E0;
            --danger-red: #E53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* --- Updated Header (No Status Bar) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            color: var(--primary-green);
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
        }

        .menu-btn {
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px;
        }

        /* --- Main Content --- */
        .content {
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .welcome p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* --- Flex/Grid Card Container --- */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            border: 1.5px solid #000;
            border-radius: 25px;
            padding: 25px;
            min-height: 150px;
        }

        .card-header {
            text-align: right;
            font-weight: 800;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .unit-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .lecturer-info {
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .attendance-text {
            color: #ccc;
            margin-bottom: 20px;
        }

        .btn-green {
            background-color: var(--primary-green);
            height: 50px;
            width: 100%;
            border-radius: 15px;
            border: none;
        }

        /* --- Sidebar Navigation --- */
        .sidebar {
            position: fixed;
            top: 60px; /* Aligned below header */
            right: -100%;
            width: 280px;
            height: calc(100% - 60px);
            background: var(--sidebar-bg);
            transition: 0.4s ease;
            padding: 20px;
            border-radius: 20px 0 0 20px;
            z-index: 999;
        }

        .sidebar.active {
            right: 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            text-decoration: none;
            color: #333;
            font-size: 1.2rem;
            gap: 15px;
        }

        .nav-link svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: var(--primary-green);
            stroke-width: 2;
        }

        .nav-link.logout {
            color: var(--danger-red);
            margin-top: 20px;
        }

        .nav-link.logout svg {
            stroke: var(--danger-red);
        }

        /* --- Media Queries --- */
        @media (min-width: 768px) {
            .cards-container {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SMART ATTENDANCE</div>
        <button class="menu-btn" onclick="toggleMenu()">
            <svg width="28" height="20" viewBox="0 0 24 18">
                <line x1="0" y1="2" x2="24" y2="2" stroke="black" stroke-width="3"/>
                <line x1="0" y1="9" x2="24" y2="9" stroke="black" stroke-width="3"/>
                <line x1="0" y1="16" x2="24" y2="16" stroke="black" stroke-width="3"/>
            </svg>
        </button>
    </header>

    <div class="content">
        <div class="welcome">
            <h1>Welcome back</h1>
            <p>Here's your attendance</p>
        </div>

        <div class="cards-container">
            <div class="card">
                <div class="card-header">Active</div>
                <div class="unit-name">Computer Programming II</div>
                <div class="lecturer-info">Lecturer: Dr. John Doe</div>
                <div class="attendance-text">Attendance 85%</div>
                <button class="btn-green"></button>
            </div>

            <div class="card" style="border-bottom: 1px solid #ccc; border-radius: 0; border-top: none; border-left: none; border-right: none;">
                <div class="unit-name" style="color: #bbb; padding-top: 40px;">Digital Electronics</div>
            </div>
        </div>
    </div>

    <nav class="sidebar" id="sidebar">
        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Dashboard
        </a>
        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            Register Units
        </a>
        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
            View Attendance
        </a>
        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            My Profile
        </a>
        <a href="#" class="nav-link">
            <svg viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3L22 7l-3-3"/></svg>
            Reset Password
        </a>
        <a href="#" class="nav-link logout">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
        </a>
    </nav>

    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
        }
    </script>
</body>
</html>
