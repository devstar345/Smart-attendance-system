<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>
    <style>
        :root {
            --primary-green: #74C947;
            --text-dark: #000000;
            --text-gray: #666;
            --bg-light: #F8F9FA;
            --card-border: #999;
            --input-bg: #D9D9D9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
        }

        /* --- Header --- */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid #eee;
        }

        .back-btn {
            cursor: pointer;
            text-decoration: none;
            color: #000;
        }

        header h1 {
            color: var(--primary-green);
            font-size: 1.25rem;
            font-weight: 700;
            flex-grow: 1;
            text-align: center;
            margin-right: 24px; /* Offset for back button to center text */
        }

        /* --- Info Bar --- */
        .info-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        /* --- Unit Title Card --- */
        .unit-title-card {
            background: #fff;
            margin: 0 10px 25px 10px;
            padding: 25px;
            text-align: center;
            border-radius: 0 0 25px 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .unit-title-card h2 {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- Registration Card --- */
        .form-container {
            padding: 0 20px;
        }

        .reg-card {
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 25px 20px;
            background: #fff;
        }

        .reg-card label {
            display: block;
            color: var(--text-gray);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        /* --- Input Area with Checkbox --- */
        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--input-bg);
            padding: 15px 20px;
            border-radius: 12px;
        }

        .reg-number {
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* Styled Checkbox */
        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            background-color: transparent;
            border: 2px solid var(--primary-green);
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background-color: transparent;
        }

        input[type="checkbox"]:checked::after {
            content: '✔';
            color: var(--primary-green);
            font-size: 16px;
            font-weight: bold;
        }

    </style>
</head>
<body>

    <header>
        <a href="#" class="back-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </a>
        <h1>Mark Attendance</h1>
    </header>

    <div class="info-bar">
        <span>CIT123</span>
        <span>23-10-2023</span>
    </div>

    <div class="unit-title-card">
        <h2>Computer Programming</h2>
    </div>

    <div class="form-container">
        <div class="reg-card">
            <label>Registration Number</label>
            <div class="input-group">
                <span class="reg-number">ENG-219-132/2024</span>
                <input type="checkbox" checked>
            </div>
        </div>
    </div>

</body>
</html>
