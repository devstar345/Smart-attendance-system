<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #68d34d;
            --border-color: #bcbcbc;
            --text-gray: #333;
            --card-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            background-color: white;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        /* Header Section */
        .header {
            display: flex;
            align-items: center;
            padding: 20px;
        }

        .back-arrow {
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            width: 30px;
        }

        .header h1 {
            flex-grow: 1;
            text-align: center;
            color: var(--primary-green);
            font-size: 1.5rem;
            font-weight: 700;
            margin-right: 30px;
        }

        /* Profile Avatar */
        .avatar-container {
            display: flex;
            justify-content: center;
            margin: 10px 0 20px;
        }

        .avatar-circle {
            width: 100px;
            height: 100px;
            background-color: #d9d9d9;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-icon {
            width: 50px;
            height: 50px;
            border: 4px solid var(--primary-green);
            border-radius: 50%;
            position: relative;
        }

        .avatar-icon::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 10px;
            background-color: var(--primary-green);
            border-radius: 10px 10px 0 0;
        }

        /* Info Sections */
        .section-card {
            border: 1px solid var(--border-color);
            border-radius: 25px;
            margin: 0 20px 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
        }

        .section-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .inner-content-box {
            border: 1px solid #000;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info-row {
            font-size: 1.1rem;
            font-weight: 500;
            color: #000;
            text-transform: uppercase;
        }

        /* Button Footer */
        .footer-action {
            padding: 10px 20px;
            margin-top: auto;
        }

        .update-btn {
            width: 100%;
            background-color: var(--primary-green);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
        }

        @media (max-width: 380px) {
            .section-card { margin: 0 10px 15px; }
            .info-row { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <header class="header">
            <div class="back-arrow">＜</div>
            <h1>My Profile</h1>
        </header>

        <main class="section-card">
            <h2 class="section-title">Basic Information</h2>
            
            <div class="avatar-container">
                <div class="avatar-circle">
                    <div style="width: 40px; height: 40px; border: 4px solid #68d34d; border-radius: 50%; position: relative;">
                        <div style="width: 18px; height: 18px; background: #68d34d; border-radius: 50%; position: absolute; top: -25px; left: 7px;"></div>
                    </div>
                </div>
            </div>

            <div class="inner-content-box">
                <div class="info-row">PF Number</div>
                <div class="info-row">Name:</div>
                <div class="info-row">ID:</div>
                <div class="info-row">Gender:</div>
                <div class="info-row">Date of Birth:</div>
            </div>
        </main>

        <section class="section-card">
            <h2 class="section-title">Contact Information</h2>
            <div class="inner-content-box">
                <div class="info-row">Phone No:</div>
                <div class="info-row">Email:</div>
            </div>
        </section>

        <div class="footer-action">
            <button class="update-btn">Update information</button>
        </div>
    </div>

</body>
</html>
